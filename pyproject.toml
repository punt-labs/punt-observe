[project]
name = "punt-observe"
version = "0.1.0"
description = "Private diagnostics and privacy-safe telemetry for Punt Labs"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Punt Labs"}]
readme = "README.md"
dependencies = ["opentelemetry-api>=1.39,<2", "opentelemetry-sdk>=1.39,<2"]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.39,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11", "mypy>=1.15", "pyright>=1.1"]

[build-system]
requires = ["uv_build>=0.9.14,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "punt_observe"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "LOG", "G", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
